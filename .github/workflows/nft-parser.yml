name: NFT Metadata Update

on: # Запуск каждые 6 часов
  workflow_dispatch:  # Ручной запуск из интерфейса GitHub

permissions:
  contents: write  # Разрешение на запись в репозиторий

jobs:
  update-nft-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        
      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Build TypeScript
        run: npm run build
        
      - name: Run NFT parser
        run: |
          # Устанавливаем параметры парсера
          export SAVE_EVERY=50
          export SYNC_BATCH=100
          export CONCURRENCY=15
          
          # Запускаем парсер с ограничением по времени
          timeout 3600s node dist/nftParser.js || true
          
      - name: Check for changes
        id: check
        run: |
          git diff --quiet || echo "changed=true" >> $GITHUB_OUTPUT
          
      - name: Commit and push if changed
        if: steps.check.outputs.changed == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          
          # Получаем текущую дату для коммита
          TIMESTAMP=$(date '+%Y-%m-%d %H:%M:%S')
          
          git add data/*.json
          git add -u
          git commit -m "🔄 Update NFT metadata - $TIMESTAMP" -m "Automatic update via GitHub Actions"
          git push 
